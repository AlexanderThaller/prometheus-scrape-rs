global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    region: eu-west-1
    replica: agent-0

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          env: prod
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):.*"
        replacement: "$1"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "node_(cpu|memory|filesystem|network).*"
        action: keep

  - job_name: services
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
          - /etc/prometheus/targets/*.json
        refresh_interval: 1m

remote_write:
  - url: https://mimir.example.com/api/v1/push
    name: durable-storage
    # remote-write 2.0: symbol-table payloads, ~half the bandwidth
    protobuf_message: io.prometheus.write.v2.Request
    basic_auth:
      username: agent
      password_file: /etc/prometheus/remote-write.password
    headers:
      X-Scope-OrgID: my-tenant
    queue_config:
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      capacity: 10000
    write_relabel_configs:
      - source_labels: [__name__]
        regex: "go_gc_.*"
        action: drop

  # Every endpoint receives every batch on its own queue, so a second entry
  # dual-writes — e.g. gigapipe/qryn storing into ClickHouse during a
  # migration off Mimir (see docs/clickhouse-migration.adoc).
  - url: http://gigapipe.example.com:3100/api/v1/prom/remote/write
    name: clickhouse-gigapipe
    # RW 1.0 (default protobuf_message); gigapipe's RW 2.0 support is unverified
